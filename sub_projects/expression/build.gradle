plugins {
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
}

repositories {
    mavenCentral()
}

group = "com.mod-buildcraft"
base {
    archivesName = "buildcraft-libexpression"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDir "src/autogen/java"
        }
    }
    generator
}

dependencies {
    api "com.google.code.findbugs:jsr305:3.0.2"
    generatorImplementation "com.google.code.findbugs:jsr305:3.0.2"
    testImplementation "junit:junit:4.13.2"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('removeOldAutoGen', Delete) {
    delete "src/autogen/java/buildcraft"
}

tasks.register('generateSources', JavaExec) {
    dependsOn 'removeOldAutoGen'
    classpath = sourceSets.generator.runtimeClasspath
    mainClass = "buildcraft.meta.generate.AutoGenerator"
    args '-out', 'src/autogen/java', '-run', '-quiet'
    outputs.dir 'src/autogen/java'
}

tasks.named('compileJava') { dependsOn 'generateSources' }
tasks.named('sourcesJar') { dependsOn 'generateSources' }

publishing {
    repositories {
        maven {
            url = System.getenv("MAVEN_DIR") ?: "build/maven"
        }
    }
    publications {
        mavenJava(MavenPublication) {
            artifactId = "buildcraft-libexpression"
            from components.java
        }
    }
}
